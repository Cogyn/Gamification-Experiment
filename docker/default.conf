server {
    listen 8000;
    listen [::]:8000;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max upload size
    client_max_body_size 50M;

    # API routes - proxy to PHP-FPM
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling for Laravel
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Static assets from Laravel public folder
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve frontend files from root
    location / {
        # First try to serve static files from public/
        # Then try to serve the file from root (frontend files)
        # Finally, serve index.html for SPA routing
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Frontend static files (CSS, JS, images from root)
    location ~* ^/(styles\.css|script\.js|logo\.png|logo_2\.png|js/|edurank/|tracking/|ai/)(.*)$ {
        root /var/www/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve index.html from root
    location = / {
        root /var/www/html;
        try_files /index.html /public/index.php?$query_string;
    }

    # Health check endpoint
    location /health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }
}
