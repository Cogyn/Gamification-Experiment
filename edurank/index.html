<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduRank - Gamified Learning Platform</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e1e2e 0%, #11111b 100%);
      padding: 1rem;
    }

    .login-card {
      background: var(--bg-secondary);
      padding: 3rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      max-width: 450px;
      width: 100%;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .login-logo-text {
      font-size: 2.5rem;
      font-weight: bold;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .feature-list {
      list-style: none;
      margin-top: 2rem;
      padding: 1.5rem;
      background: var(--bg-tertiary);
      border-radius: 0.75rem;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      color: var(--text-secondary);
    }

    .feature-item:last-child {
      margin-bottom: 0;
    }

    .feature-icon {
      color: var(--primary);
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">🎓</div>
        <div class="login-logo-text">EduRank</div>
      </div>

      <p class="login-subtitle">
        Gamified Learning Platform - Level up your knowledge!
      </p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">E-Mail</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="demo@edurank.com"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Passwort</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            required
          >
          <div class="form-helper">
            Demo-Modus: Beliebige E-Mail und Passwort verwenden
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          <i class="fas fa-sign-in-alt"></i> Anmelden
        </button>
      </form>

      <ul class="feature-list">
        <li class="feature-item">
          <i class="fas fa-star feature-icon"></i>
          <span>Sammle XP und steige auf</span>
        </li>
        <li class="feature-item">
          <i class="fas fa-fire feature-icon"></i>
          <span>Halte deine Streak am Leben</span>
        </li>
        <li class="feature-item">
          <i class="fas fa-coins feature-icon"></i>
          <span>Verdiene Brain Coins</span>
        </li>
        <li class="feature-item">
          <i class="fas fa-trophy feature-icon"></i>
          <span>Klettere die Ranglisten hoch</span>
        </li>
      </ul>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (login(email, password)) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
